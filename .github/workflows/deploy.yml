name: Deploy

# A commit merged into main that changes the tv-launcher-tmdb Worker is tested
# and deployed from the owner's Mac (self-hosted runner tv-launcher-mac), with
# the Cloudflare login wrangler already holds there - the deploy half of
# tools/tmdb-proxy/deploy.sh. TMDB_KEY and SENTRA_TOKEN are Worker secrets that
# a deploy keeps, so nothing secret is needed here. The launcher itself is
# released by release.yml, as before.
on:
  push:
    branches: [main]
    paths:
      - "tools/tmdb-proxy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-launcher-tmdb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, tv-launcher-mac]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/tmdb-proxy
    steps:
      # On power the Mac sleeps after a minute, and a sleeping runner loses
      # GitHub mid-job. caffeinate holds it awake while the job runs.
      - name: Keep the Mac awake
        run: nohup caffeinate -ims >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Deploy only the current main tip
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Worker tests
        run: npm test
      - name: Deploy tv-launcher-tmdb
        run: npx -y wrangler@4 deploy
