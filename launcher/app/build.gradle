plugins {
    id 'com.android.application'
}

// The top shelf's TMDB requests go through the tv-launcher-tmdb Worker (config.xml tmdb_proxy, tools/tmdb-proxy), which
// holds the key, so builds carry none. tmdb.key=... in launcher/local.properties (git ignores it) is only what
// tools/tmdb-proxy/deploy.sh hands the Worker.

// The release key (made once, kept off the repository): ~/.tv-launcher/release.jks, its password in the macOS
// Keychain (service tv-launcher-release-key) or in TV_LAUNCHER_KEY_PASSWORD. Every TV trusts only the key its
// launcher was signed with, so updates must come from this key. Without it (CI, a fork) the debug key signs.
def releaseStore = new File(System.getProperty('user.home'), '.tv-launcher/release.jks')
def releasePassword = System.getenv('TV_LAUNCHER_KEY_PASSWORD') ?: ''
if (releaseStore.isFile() && !releasePassword && new File('/usr/bin/security').canExecute()) {
    def p = ['/usr/bin/security', 'find-generic-password', '-a', 'tv-launcher', '-s', 'tv-launcher-release-key', '-w'].execute()
    p.waitFor()
    if (p.exitValue() == 0) releasePassword = p.text.trim()
}
def hasReleaseKey = releaseStore.isFile() && releasePassword

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 68
        versionName '1.16'
        // Ukrainian only: res/values is Ukrainian, and the libraries' other translations stay out of the APK.
        resourceConfigurations += ['uk']
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile releaseStore
                storePassword releasePassword
                keyAlias 'tv-launcher'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
