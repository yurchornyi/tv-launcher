name = "tv-launcher-tmdb"
main = "worker.js"
compatibility_date = "2026-10-01"
account_id = "175aa69489121cb4274c780bc5195f18"   # Cloudflare account "Basic"
workers_dev = true

[observability]
enabled = true

# The AI routes (ai.js): per asker (account and profile, else the TV, else the address), so the public URL cannot be
# used to spend the Sentra allowance; two TVs with one profile share it.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# The AI routes per address, above AI_LIMIT: the asker is the TV's word, so made-up ids cannot get round it. Room for
# two profiles at home asking at full speed.
[[ratelimits]]
name = "AI_ADDRESS"
namespace_id = "1008"
simple = { limit = 24, period = 60 }

# The TMDB proxy: per-address limit on requests that miss the cache, so the public URL cannot spend the token.
[[ratelimits]]
name = "TMDB_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Writes to an account (its Home, its apps' settings): per account.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1006"
simple = { limit = 20, period = 60 }

# The AI routes for all TVs together (on top of AI_LIMIT per asker and AI_ADDRESS per address).
[[ratelimits]]
name = "AI_GLOBAL"
namespace_id = "1007"
simple = { limit = 60, period = 60 }

# Exact counters for PIN tries, sign-in tries and new accounts (guard.js, account.js).
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]

# Accounts and their synced Home (account.js).
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "6e74394e0755459494f2678a18b530d9"

[vars]
# The account that sees and deletes the others (account.js /account/admin) is the ADMIN_EMAIL secret, not a var:
# `npx wrangler secret put ADMIN_EMAIL`, then tools/tmdb-proxy/make-admin.sh sets its PIN.
SENTRA_URL = "https://sentra.sntr.workers.dev"
